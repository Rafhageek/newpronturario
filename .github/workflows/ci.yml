name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancela runs antigos do mesmo branch/PR (economiza minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade · lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Testes unitários
        run: pnpm test
      # Falha se alguém adicionar biblioteca nativa (ou mudar plugin/permissão/
      # minSdk) sem subir o runtimeVersion. Sem isso, um `eas update` entregaria
      # código novo a um APK que não tem o módulo nativo e o app quebraria no
      # boot em produção. Substitui a policy 'fingerprint', que não funciona
      # neste monorepo pnpm (ver comentário em apps/mobile/app.config.ts).
      - name: Guard do runtimeVersion (mudança nativa exige APK novo)
        run: pnpm --filter @hubpatients/mobile run check:runtime

  dependency-security:
    name: Segurança · segredos e dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # BLOQUEIA: segredo versionado é sempre real e sempre tem conserto
      # (remover, rotacionar). Aqui o vermelho significa "faça algo agora".
      - name: Detectar segredos versionados sem imprimir valores
        run: pnpm security:secrets

      # NÃO BLOQUEIA — e isso é decisão consciente, não desleixo.
      #
      # Num monorepo Expo/React Native o `audit` é dominado por transitivas de
      # FERRAMENTA DE BUILD que o autor do app não controla nem consegue
      # atualizar, e que não entram no bundle instalado. Exemplo real desta
      # árvore: @gorhom/bottom-sheet > @gorhom/portal > react-native >
      # babel-jest > ... > brace-expansion. Rodar com `--prod` não resolve,
      # porque o react-native declara essas ferramentas como dependências
      # normais (37 achados mesmo em modo produção).
      #
      # Manter isso bloqueando deixaria o CI vermelho de forma permanente por
      # algo insolúvel — e um portão que vive fechado ensina todo mundo a
      # ignorá-lo, justamente quando aparecer um problema de verdade. O
      # resultado continua VISÍVEL no log; só deixa de travar o merge.
      #
      # Revisar quando: o Expo/RN atualizar as transitivas, ou se algum achado
      # apontar para dependência DIRETA do app (aí é acionável — corrigir e,
      # se fizer sentido, voltar a bloquear).
      - name: Vulnerabilidades em dependências (informativo — não bloqueia)
        continue-on-error: true
        run: pnpm security:deps

  security-rls:
    name: Segurança · RLS/escalada (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Este job é o portão de banco do projeto: roda em TODO push/PR, o que é um
    # superconjunto de "quando `supabase/**` mudar". É de propósito — mudança em
    # app/ também quebra expectativa de RLS (ex.: passar a ler uma tabela nova).
    #
    # Se um dia os minutos apertarem, dá para restringir a `supabase/**` com o
    # bloco abaixo (exige o job `changes` + `dorny/paths-filter`):
    #
    #   changes:
    #     runs-on: ubuntu-latest
    #     outputs:
    #       supabase: ${{ steps.filtro.outputs.supabase }}
    #     steps:
    #       - uses: actions/checkout@v4
    #       - uses: dorny/paths-filter@v3
    #         id: filtro
    #         with:
    #           filters: |
    #             supabase:
    #               - 'supabase/**'
    #
    #   security-rls:
    #     needs: changes
    #     if: needs.changes.outputs.supabase == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          # Versão estável fixa: evita mudanças inesperadas no runner.
          version: 2.109.1
      - name: Subir Supabase local
        run: supabase start
      - name: Aplicar todas as migrations (reset)
        run: supabase db reset --no-seed
      - name: Listar a suíte pgTAP que será executada
        run: ls -1 supabase/tests/*.sql
      - name: Rodar testes pgTAP (RLS, escalada P0 e hardening)
        run: supabase test db
      - name: Lint do banco (informativo — não bloqueia)
        continue-on-error: true
        run: supabase db lint --level warning

  build-web:
    name: Build (web)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web
        working-directory: apps/web
        env:
          # Placeholders só para o build estático passar; o deploy usa segredos reais.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: pnpm build

  e2e-web:
    name: E2E (web · Playwright)
    needs: [quality, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar navegador do Playwright
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Rodar e2e (o webServer sobe next dev)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: pnpm test:e2e
      - name: Guardar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
