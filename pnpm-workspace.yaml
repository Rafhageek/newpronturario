packages:
  - "apps/*"
  - "packages/*"
# Expo/React Native precisam das deps nativas acessíveis no topo (hoisted) —
# o mesmo motivo que já estava documentado no .npmrc (node-linker/shamefully-hoist),
# mas o pnpm 10.4+ (aqui: 11.5.2) parou de ler esses dois campos do .npmrc; agora
# moram aqui. Sem isso, o node_modules vira isolado (.pnpm com symlinks) mesmo com
# o .npmrc pedindo hoisted — e presets do Babel que resolvem sub-plugin por STRING
# (não por require() direto) quebram sob isolamento estrito: `eas update` local
# falhava com "Cannot find module '@babel/plugin-transform-react-jsx'" mesmo com
# o pacote presente e corretamente linkado três níveis abaixo — Node/Babel não
# resolve através da cadeia de symlinks isolada.
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  sharp: true

# Overrides DUPLICADOS de propósito (aqui + package.json -> pnpm.overrides):
# pnpm >= 10.4 (local 11.5.2) lê deste arquivo; pnpm mais antigo (servidor EAS)
# lê do package.json. Manter os MESMOS valores nos dois evita o
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH no `pnpm install --frozen-lockfile` do EAS.
# Expo 54 exige react 19.1.0; unificar tipos evita conflito de @types/react no web.
overrides:
  react: 19.1.0
  react-dom: 19.1.0
  "@types/react": ~19.1.0
  "@types/react-dom": ~19.1.0
